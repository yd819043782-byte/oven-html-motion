<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>嵌入式烤箱选购 · 识食务者</title>
  <style>
    @font-face {
      font-family: "OvenUI";
      src: url("assets/oven-ui.woff2") format("woff2");
      font-weight: 400 700;
      font-style: normal;
      font-display: block;
    }
    html, body {
      margin: 0;
      background: #000;
      height: 100%;
      overflow: hidden;
    }
    body.export {
      width: 1920px;
      height: 1080px;
    }
    #stage {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1920px;
      height: 1080px;
      margin-left: -960px;
      margin-top: -540px;
      overflow: hidden;
      background: #100e0c;
      transform-origin: center center;
    }
    body.export #stage {
      left: 0;
      top: 0;
      margin: 0;
      transform: none !important;
    }
    #gl {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      display: block;
    }
    #dim {
      position: absolute;
      inset: 0;
      background: #070604;
      opacity: 0;
      pointer-events: none;
      z-index: 2;
    }
    #vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 6;
      background:
        linear-gradient(to top, rgba(0,0,0,.55), rgba(0,0,0,0) 70px),
        radial-gradient(ellipse at 50% 42%, transparent 48%, rgba(0,0,0,.42) 100%);
    }
    #labels, #jd-rig, #pin {
      position: absolute;
      z-index: 5;
      pointer-events: none;
    }
    #jd-rig, #pin { opacity: 0; }
    #labels { inset: 0; }
    .chip {
      position: absolute;
      left: 0;
      top: 0;
      color: #f6f1e8;
      font-family: "OvenUI", "WenQuanYi Micro Hei", sans-serif;
      font-size: 18px;
      letter-spacing: 0.06em;
      white-space: nowrap;
      text-shadow: 0 2px 10px rgba(0,0,0,.55);
      will-change: transform, opacity;
    }
    .chip.red { color: #ffd7d2; }
    .chip.ghost {
      color: rgba(246,241,232,.78);
      letter-spacing: 0.14em;
      font-size: 14px;
    }
    .chip.pill {
      background: rgba(12, 10, 8, .66);
      border-radius: 999px;
      padding: 3px 9px;
    }
    .stamp {
      border: 1.5px solid #e1251b;
      color: #ffb2aa;
      padding: 5px 12px;
      border-radius: 3px;
      letter-spacing: 0.22em;
      background: rgba(80, 8, 6, .28);
    }
    #jd-rig {
      left: 610px;
      top: 86px;
      width: 860px;
      height: 820px;
      z-index: 4;
      perspective: 1400px;
    }
    #jd-window {
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 16px;
      background: #fff;
      box-shadow:
        0 24px 70px rgba(0,0,0,.48),
        0 0 0 1px rgba(255,255,255,.35);
      transform-origin: 18% 50%;
    }
    #jd-window img {
      width: 860px;
      height: auto;
      display: block;
      transform-origin: 40% 22%;
    }
    #jd-ring {
      position: absolute;
      border: 2px solid rgba(225, 37, 27, .95);
      border-radius: 10px;
      box-shadow: 0 0 0 7px rgba(225, 37, 27, .16), inset 0 0 0 1px rgba(255,255,255,.35);
    }
    #jd-cap {
      position: absolute;
      left: 16px;
      top: 12px;
      font-family: "OvenUI", sans-serif;
      font-size: 13px;
      letter-spacing: 0.08em;
      color: #5c1a16;
      background: rgba(255,255,255,.9);
      border-radius: 999px;
      padding: 4px 10px;
    }
    #pin {
      left: 64px;
      top: 0;
      width: 280px;
      padding: 12px 14px 13px;
      border-radius: 14px;
      background: rgba(255,248,240,.94);
      color: #2a211c;
      box-shadow: 0 12px 30px rgba(0,0,0,.28);
      font-family: "OvenUI", sans-serif;
    }
    #pin .kicker {
      font-size: 12px;
      letter-spacing: 0.16em;
      color: #e1251b;
    }
    #pin .body {
      margin-top: 4px;
      font-size: 16px;
      letter-spacing: 0.04em;
    }
    #pin .nail {
      position: absolute;
      left: 22px;
      top: -7px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff, #c45a52 45%, #7a241e);
      box-shadow: 0 2px 0 rgba(0,0,0,.25);
    }
    #control-hit {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 92px;
      z-index: 8;
    }
    #controls {
      position: absolute;
      left: 28px;
      right: 28px;
      bottom: 14px;
      height: 48px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 12px 0 10px;
      box-sizing: border-box;
      border-radius: 999px;
      background: rgba(16, 14, 12, .82);
      border: 1px solid rgba(255,255,255,.16);
      color: #f6f1e8;
      font-family: "OvenUI", sans-serif;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity .18s linear, transform .18s linear;
      pointer-events: none;
    }
    #control-hit:hover #controls,
    #control-hit:focus-within #controls {
      opacity: 1;
      transform: none;
      pointer-events: auto;
    }
    body.export #control-hit { display: none !important; }
    #controls button {
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 50%;
      background: #f6f1e8;
      color: #1c1612;
      display: grid;
      place-items: center;
      cursor: pointer;
      padding: 0;
    }
    #controls button svg { width: 14px; height: 14px; display: block; }
    #scrub {
      flex: 1;
      accent-color: #e1251b;
      cursor: pointer;
    }
    #time {
      font-size: 13px;
      letter-spacing: 0.06em;
      min-width: 92px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    #boot-error {
      position: absolute;
      inset: 0;
      z-index: 9;
      display: none;
      place-items: center;
      color: #f6f1e8;
      font-family: "OvenUI", sans-serif;
      background: #100e0c;
      text-align: center;
      padding: 48px;
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="gl" width="1920" height="1080"></canvas>
    <div id="dim"></div>
    <div id="jd-rig">
      <div id="jd-window">
        <img id="jd-img" alt="京东嵌入式烤箱搜索，约 5K 价位" src="assets/jd-oven-search.png" />
      </div>
      <div id="jd-ring"></div>
      <div id="jd-cap">双十一 · 搜嵌入式烤箱</div>
    </div>
    <div id="labels"></div>
    <div id="pin">
      <div class="nail"></div>
      <div class="kicker">置顶评论</div>
      <div class="body">机型清单放在这条下面</div>
    </div>
    <div id="vignette"></div>
    <div id="control-hit">
      <div id="controls">
        <button id="btn-play" type="button" aria-label="播放">
          <svg id="icon-play" viewBox="0 0 12 12" aria-hidden="true"><polygon points="2.2,0.8 11,6 2.2,11.2" fill="currentColor"></polygon></svg>
          <svg id="icon-pause" viewBox="0 0 12 12" aria-hidden="true" hidden><rect x="1.6" y="0.8" width="3" height="10.4" rx="0.6" fill="currentColor"></rect><rect x="7.4" y="0.8" width="3" height="10.4" rx="0.6" fill="currentColor"></rect></svg>
        </button>
        <button id="btn-replay" type="button" aria-label="重播">
          <svg viewBox="0 0 12 12" aria-hidden="true">
            <path d="M6.2 1.6a4.2 4.2 0 1 1-3.6 2.1" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"></path>
            <polygon points="1.2,2.2 4.6,1.5 2.6,4.4" fill="currentColor"></polygon>
          </svg>
        </button>
        <input id="scrub" type="range" min="0" max="1" step="0.0166667" value="0" aria-label="时间" />
        <span id="time">0:00.00</span>
      </div>
    </div>
    <div id="boot-error"></div>
  </div>
  <script src="assets/three.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
